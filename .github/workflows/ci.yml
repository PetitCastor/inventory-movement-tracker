name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # The core library targets plain net11.0, so Linux is enough until a Windows-only project
    # (tray host, WebView2 window) joins the solution.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build InventoryMovementTracker.slnx --configuration Release

      - name: Test
        run: dotnet test InventoryMovementTracker.slnx --configuration Release --no-build
